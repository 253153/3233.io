name: Release

# Triggered by pushing a semver tag (e.g. v0.1.0). Produces:
#   - GitHub Release with auto-generated notes
#   - io3233-server-linux-x86_64.tar.gz  (Linux x86_64 Rust binary)
#   - io3233-client-dist.tar.gz          (built SPA bundle for STATIC_DIR / any static host)
#   - ghcr.io/<owner>/<repo>:<tag>       (multi-tagged Docker image)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write   # create release + upload assets
  packages: write   # push to ghcr.io

jobs:
  binary:
    name: Build Linux x86_64 server binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release
        working-directory: server
        run: cargo build --release --locked

      - name: Package artifact
        run: |
          mkdir -p out
          cp server/target/release/io3233-server out/
          tar -C out -czf io3233-server-linux-x86_64.tar.gz io3233-server

      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-x86_64
          path: io3233-server-linux-x86_64.tar.gz
          if-no-files-found: error

  client:
    name: Build static client bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build

      - name: Package artifact
        run: tar -C client/dist -czf io3233-client-dist.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: io3233-client-dist.tar.gz
          if-no-files-found: error

  docker:
    name: Publish Docker image to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        # ghcr.io repository segments must be lowercase
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create GitHub Release
    needs: [binary, client, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - name: Lowercase repo for image URL
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            ## Install

            ### Docker
            ```bash
            docker pull ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            # or
            docker pull ${{ steps.img.outputs.name }}:latest
            ```
            See **[README — Quick start (Docker)](https://github.com/${{ github.repository }}#quick-start-docker)** for the `.env` / `JWT_SECRET` setup.

            ### Linux x86_64 binary
            ```bash
            tar -xzf io3233-server-linux-x86_64.tar.gz
            JWT_SECRET=$(openssl rand -hex 32) STATIC_DIR=./client-dist ./io3233-server
            ```
            See **[Configuration](https://github.com/${{ github.repository }}#configuration)** for env vars.

            ### Static client
            `io3233-client-dist.tar.gz` is the prebuilt SPA. Point the server's `STATIC_DIR` at the extracted directory, or upload it to any static host.
